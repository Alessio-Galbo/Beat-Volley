<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="liberoBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="60%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </radialGradient>
    <linearGradient id="skinGirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ed"/>
      <stop offset="100%" stop-color="#fde2d0"/>
    </linearGradient>
    <!-- Capelli Biondo/Miele a Caschetto Anni '80 (Stile Nami Hayakawa) -->
    <linearGradient id="hairHoney" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="irisGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="jerseyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="liberoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#liberoBg)" stroke="#059669" stroke-width="6"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Maglia Libero Verde a Contrasto con Colletto Bianco -->
  <g filter="url(#liberoShadow)">
    <path d="M 90 390 Q 120 280 200 280 Q 280 280 310 390 Z" fill="url(#jerseyGreen)" stroke="#111827" stroke-width="4"/>
    <path d="M 160 280 Q 200 310 240 280 Z" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <text x="200" y="365" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="#ffffff" stroke="#111827" stroke-width="2.5" text-anchor="middle">12</text>
  </g>

  <!-- Collo -->
  <path d="M 176 210 L 176 290 Q 200 300 224 290 L 224 210 Z" fill="url(#skinGirl)" stroke="#111827" stroke-width="4"/>
  <path d="M 176 220 L 200 252 L 224 220 L 224 240 Q 200 265 176 240 Z" fill="#f8b691"/>

  <!-- Orecchie -->
  <ellipse cx="136" cy="195" rx="12" ry="19" fill="url(#skinGirl)" stroke="#111827" stroke-width="3.5"/>
  <ellipse cx="264" cy="195" rx="12" ry="19" fill="url(#skinGirl)" stroke="#111827" stroke-width="3.5"/>

  <!-- Viso Cel-Shade -->
  <g filter="url(#liberoShadow)">
    <path d="M 142 160 Q 140 215 176 245 Q 200 260 224 245 Q 260 215 258 160 Q 255 105 200 105 Q 145 105 142 160 Z" fill="url(#skinGirl)" stroke="#111827" stroke-width="4"/>
  </g>

  <!-- Occhi Anime Grandi e Verdone Vintage -->
  <g>
    <!-- Occhio Sinistro -->
    <path d="M 154 178 Q 172 162 192 176" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 158 179 Q 172 169 188 179 Q 185 205 173 205 Q 161 205 158 179 Z" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <ellipse cx="174" cy="190" rx="11" ry="14" fill="url(#irisGreen)"/>
    <ellipse cx="174" cy="189" rx="6" ry="8" fill="#111827"/>
    <circle cx="169" cy="184" r="4" fill="#ffffff"/>
    <circle cx="178" cy="195" r="2" fill="#ffffff"/>
    <!-- Occhio Destro -->
    <path d="M 208 176 Q 228 162 246 178" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 212 179 Q 228 169 242 179 Q 239 205 227 205 Q 215 205 212 179 Z" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <ellipse cx="226" cy="190" rx="11" ry="14" fill="url(#irisGreen)"/>
    <ellipse cx="226" cy="189" rx="6" ry="8" fill="#111827"/>
    <circle cx="221" cy="184" r="4" fill="#ffffff"/>
    <circle cx="230" cy="195" r="2" fill="#ffffff"/>

    <!-- Sopracciglia e Blush -->
    <path d="M 154 164 Q 172 154 192 164" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 208 164 Q 228 154 246 164" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    <g stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="152" y1="210" x2="157" y2="218"/><line x1="158" y1="209" x2="163" y2="217"/>
      <line x1="237" y1="209" x2="242" y2="217"/><line x1="243" y1="210" x2="248" y2="218"/>
    </g>
    <!-- Naso e Sorriso Dolce -->
    <path d="M 201 194 L 198 203 L 202 203" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 188 223 Q 200 238 212 223" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Capelli a Caschetto Vintage con Frangetta Squadrata Anni '80 -->
  <g>
    <path d="M 134 140 Q 110 180 128 225 Q 138 200 144 175 Q 140 120 180 80 Q 220 80 256 120 Q 262 175 256 225 Q 275 180 266 140 Q 275 90 200 65 Q 125 90 134 140 Z" fill="#b45309" stroke="#111827" stroke-width="4"/>
    <path d="M 140 145 Q 130 190 138 220 L 148 180 Q 146 130 170 115 Q 190 120 200 135 Q 210 120 230 115 Q 254 130 252 180 L 262 220 Q 270 190 260 145 Q 255 85 200 80 Q 145 85 140 145 Z" fill="url(#hairHoney)" stroke="#111827" stroke-width="3.5"/>
  </g>

</svg>
