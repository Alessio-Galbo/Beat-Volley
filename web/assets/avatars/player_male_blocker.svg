<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="blockerBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="skinGuy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ed"/>
      <stop offset="100%" stop-color="#fde2d0"/>
    </linearGradient>
    <linearGradient id="hairBlonde" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="jerseyBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="blockerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#854d0e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#blockerBg)" stroke="#eab308" stroke-width="6"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Maglia Nera e Oro Vintage da Centrale (#2) -->
  <g filter="url(#blockerShadow)">
    <path d="M 85 390 Q 115 275 200 275 Q 285 275 315 390 Z" fill="url(#jerseyBlack)" stroke="#111827" stroke-width="4"/>
    <path d="M 85 390 L 120 280 L 140 390 Z" fill="#eab308" stroke="#111827" stroke-width="3"/>
    <path d="M 315 390 L 280 280 L 260 390 Z" fill="#eab308" stroke="#111827" stroke-width="3"/>
    <path d="M 165 275 Q 200 305 235 275 Z" fill="#eab308" stroke="#111827" stroke-width="3"/>
    <text x="200" y="365" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="#eab308" stroke="#111827" stroke-width="2.5" text-anchor="middle">2</text>
  </g>

  <!-- Collo e Mento Squadrato -->
  <path d="M 172 210 L 172 295 Q 200 305 228 295 L 228 210 Z" fill="url(#skinGuy)" stroke="#111827" stroke-width="4"/>
  <path d="M 172 222 L 200 258 L 228 222 L 228 245 Q 200 270 172 245 Z" fill="#e2a882"/>

  <!-- Orecchie -->
  <ellipse cx="132" cy="195" rx="13" ry="21" fill="url(#skinGuy)" stroke="#111827" stroke-width="3.5"/>
  <ellipse cx="268" cy="195" rx="13" ry="21" fill="url(#skinGuy)" stroke="#111827" stroke-width="3.5"/>

  <!-- Viso Cel-Shade -->
  <g filter="url(#blockerShadow)">
    <path d="M 140 155 Q 138 215 174 246 Q 200 262 226 246 Q 262 215 260 155 Q 255 105 200 105 Q 145 105 140 155 Z" fill="url(#skinGuy)" stroke="#111827" stroke-width="4"/>
  </g>

  <!-- Occhi Fieri e Concentrati da Muro -->
  <g>
    <!-- Occhio Sinistro -->
    <path d="M 152 176 Q 172 166 192 176" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 156 177 Q 172 170 188 177 Q 185 201 173 201 Q 161 201 156 177 Z" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <ellipse cx="174" cy="188" rx="9" ry="12" fill="#0284c7"/>
    <ellipse cx="174" cy="187" rx="5" ry="7" fill="#0f172a"/>
    <circle cx="171" cy="183" r="3.5" fill="#ffffff"/>

    <!-- Occhio Destro -->
    <path d="M 208 176 Q 228 166 248 176" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 212 177 Q 228 170 244 177 Q 239 201 227 201 Q 215 201 212 177 Z" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <ellipse cx="226" cy="188" rx="9" ry="12" fill="#0284c7"/>
    <ellipse cx="226" cy="187" rx="5" ry="7" fill="#0f172a"/>
    <circle cx="223" cy="183" r="3.5" fill="#ffffff"/>

    <!-- Sopracciglia Aggressive -->
    <path d="M 148 162 L 194 165" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
    <path d="M 252 162 L 206 165" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>

    <!-- Naso e Sorriso Sfida -->
    <path d="M 200 188 L 196 200 L 202 200" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 188 223 Q 200 234 212 223" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Capelli Biondi a Spazzola Dinamici Anni '80 -->
  <g>
    <path d="M 134 140 Q 110 80 150 40 Q 180 15 200 15 Q 220 15 250 40 Q 290 80 266 140 Z" fill="#ca8a04" stroke="#111827" stroke-width="4"/>
    <!-- Ciocche a Spina -->
    <path d="M 135 145 L 145 100 L 160 120 L 175 75 L 195 105 L 205 60 L 220 100 L 235 75 L 250 115 L 265 145 Z" fill="url(#hairBlonde)" stroke="#111827" stroke-width="3.5"/>
  </g>
</svg>
