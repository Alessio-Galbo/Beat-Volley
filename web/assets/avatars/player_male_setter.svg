<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Sfondo Circolare Retrò Azzurro Sportivo -->
    <radialGradient id="retroBgBlue" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <linearGradient id="skinBoy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2e8"/>
      <stop offset="100%" stop-color="#fcdbc4"/>
    </linearGradient>
    <!-- Capelli Castano Scuro / Nero Anni '80 (Omaggio a Shiro) -->
    <linearGradient id="hairDarkRetro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Iride Anime Marrone / Ambra Intenso Vintage -->
    <linearGradient id="irisBrownRetro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Maglia Blu e Gialla Vintage -->
    <linearGradient id="jerseyBlueRetro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="celShadowBoy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bordo e Sfondo Medaglione Vintage -->
  <circle cx="200" cy="200" r="190" fill="url(#retroBgBlue)" stroke="#0284c7" stroke-width="6"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Linee di Velocità Anni '80 -->
  <g opacity="0.22" stroke="#0284c7" stroke-width="2">
    <line x1="20" y1="90" x2="380" y2="140"/>
    <line x1="10" y1="290" x2="390" y2="240"/>
  </g>

  <!-- Torso e Maglia Atletica Vintage Palleggiatore (#4) -->
  <g id="jerseyGroupBoy" filter="url(#celShadowBoy)">
    <path d="M 85 390 Q 115 275 200 275 Q 285 275 315 390 Z" fill="url(#jerseyBlueRetro)" stroke="#111827" stroke-width="4"/>
    <!-- Inserti Spalle e Maniche Giallo Sole Vintage -->
    <path d="M 85 390 L 120 280 L 145 390 Z" fill="#fbbf24" stroke="#111827" stroke-width="3"/>
    <path d="M 315 390 L 280 280 L 255 390 Z" fill="#fbbf24" stroke="#111827" stroke-width="3"/>
    <!-- Colletto a V Anni '80 -->
    <path d="M 165 275 L 200 315 L 235 275 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5"/>
    <!-- Numero Maglia (#4 da Palleggiatore / Regista) -->
    <text x="200" y="365" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="#fbbf24" stroke="#111827" stroke-width="2.5" text-anchor="middle">4</text>
  </g>

  <!-- Collo Maschile e Spalle Squadrate -->
  <g id="neckBoy">
    <path d="M 172 210 L 172 295 Q 200 305 228 295 L 228 210 Z" fill="url(#skinBoy)" stroke="#111827" stroke-width="4"/>
    <path d="M 172 222 L 200 258 L 228 222 L 228 245 Q 200 270 172 245 Z" fill="#e2a882"/>
  </g>

  <!-- Orecchie Maschili -->
  <ellipse cx="132" cy="195" rx="13" ry="21" fill="url(#skinBoy)" stroke="#111827" stroke-width="3.5"/>
  <ellipse cx="268" cy="195" rx="13" ry="21" fill="url(#skinBoy)" stroke="#111827" stroke-width="3.5"/>

  <!-- Viso Cel-Shade Maschile Determinato -->
  <g id="faceGroupBoy" filter="url(#celShadowBoy)">
    <path d="M 140 155 Q 138 215 174 246 Q 200 262 226 246 Q 262 215 260 155 Q 255 105 200 105 Q 145 105 140 155 Z" fill="url(#skinBoy)" stroke="#111827" stroke-width="4"/>
  </g>

  <!-- Occhi Shiro (Determinato, Sportivo, Sguardo Sicuro) -->
  <g id="eyesBoy">
    <!-- Occhio Sinistro -->
    <g id="leftEyeBoy">
      <path d="M 152 178 Q 172 165 192 176" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
      <path d="M 156 179 Q 172 170 188 179 Q 185 204 173 204 Q 161 204 156 179 Z" fill="#ffffff" stroke="#111827" stroke-width="2"/>
      <ellipse cx="174" cy="190" rx="10" ry="13" fill="url(#irisBrownRetro)"/>
      <ellipse cx="174" cy="189" rx="6" ry="8" fill="#111827"/>
      <circle cx="170" cy="184" r="3.5" fill="#ffffff"/>
      <circle cx="177" cy="195" r="2" fill="#ffffff"/>
      <path d="M 160 204 Q 173 206 184 204" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Occhio Destro -->
    <g id="rightEyeBoy">
      <path d="M 208 176 Q 228 165 248 178" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
      <path d="M 212 179 Q 228 170 244 179 Q 239 204 227 204 Q 215 204 212 179 Z" fill="#ffffff" stroke="#111827" stroke-width="2"/>
      <ellipse cx="226" cy="190" rx="10" ry="13" fill="url(#irisBrownRetro)"/>
      <ellipse cx="226" cy="189" rx="6" ry="8" fill="#111827"/>
      <circle cx="222" cy="184" r="3.5" fill="#ffffff"/>
      <circle cx="229" cy="195" r="2" fill="#ffffff"/>
      <path d="M 216 204 Q 227 206 240 204" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Sopracciglia Folte e Decise da Capitano -->
    <path d="M 150 160 Q 172 148 194 160" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <path d="M 206 160 Q 228 148 250 160" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>

    <!-- Naso e Bocca con Sorriso Sicuro -->
    <path d="M 200 188 L 196 200 L 202 200" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 188 222 Q 200 236 212 222" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M 190 223 Q 200 230 210 223 Z" fill="#ffffff"/>
  </g>

  <!-- Capelli con Ciuffo Dinamico Anni '80 (Stile Shiro Tachiki) -->
  <g id="hairBoy">
    <!-- Volume Posteriore -->
    <path d="M 140 150 Q 100 100 130 50 Q 170 20 230 25 Q 280 40 280 90 Q 300 140 260 170 Z" fill="#111827" stroke="#111827" stroke-width="3"/>
    <!-- Ciuffo Frontale a Ciocche Marcate -->
    <path d="M 130 145 Q 110 90 160 55 Q 170 85 190 70 Q 200 45 230 50 Q 240 80 260 75 Q 275 110 240 135 Q 225 105 210 120 Q 195 95 180 125 Q 165 105 145 135 Z" fill="url(#hairDarkRetro)" stroke="#111827" stroke-width="4"/>
    <!-- Basette Maschili -->
    <path d="M 140 140 L 134 185 L 144 165 Z" fill="#111827"/>
    <path d="M 260 140 L 266 185 L 256 165 Z" fill="#111827"/>
    <!-- Riflesso Bluastro Tipico Anni '80 -->
    <path d="M 160 55 Q 200 40 240 55 Q 220 50 180 50 Z" fill="#60a5fa" opacity="0.4"/>
  </g>

</svg>
