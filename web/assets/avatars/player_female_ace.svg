<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Sfondo Circolare Retrò -->
    <radialGradient id="retroBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="60%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <!-- Tonalità Pelle Stile Anime Anni '80 Cel-Shade -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0e6"/>
      <stop offset="100%" stop-color="#ffe3d1"/>
    </linearGradient>
    <!-- Capelli Arancio Fuoco Iconici (Omaggio a Mila) -->
    <linearGradient id="hairOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ea4310"/>
    </linearGradient>
    <linearGradient id="hairShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c22d05"/>
      <stop offset="100%" stop-color="#9a1d00"/>
    </linearGradient>
    <!-- Iride Anime Vintage Cel -->
    <linearGradient id="irisRetro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <!-- Maglia Nazionale/Seven Fighters (Bianco e Rosso) -->
    <linearGradient id="jerseyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="celShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#881337" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bordo e Sfondo Medaglione Vintage -->
  <circle cx="200" cy="200" r="190" fill="url(#retroBg)" stroke="#e11d48" stroke-width="6"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Linee di Velocità / Dinamiche di Fondo Tipiche degli Anime Sportivi Anni '80 -->
  <g opacity="0.25" stroke="#e11d48" stroke-width="2">
    <line x1="20" y1="120" x2="380" y2="80"/>
    <line x1="10" y1="160" x2="390" y2="120"/>
    <line x1="30" y1="280" x2="370" y2="320"/>
  </g>

  <!-- Sagoma Superiore Palla Volley Retrò sullo Sfondo -->
  <g opacity="0.12" fill="none" stroke="#e11d48" stroke-width="4">
    <circle cx="200" cy="200" r="130"/>
    <path d="M 108 108 Q 200 160 200 200 Q 200 240 292 292"/>
    <path d="M 292 108 Q 240 200 200 200 Q 160 200 108 292"/>
  </g>

  <!-- Torso e Divisa Vintage (Maglia Girocollo e Spalline) -->
  <g id="jerseyGroup" filter="url(#celShadow)">
    <!-- Spalle e Torso -->
    <path d="M 90 390 Q 120 280 200 280 Q 280 280 310 390 Z" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
    <!-- Fianchi e Fascia Rossa Classica Divisa -->
    <path d="M 90 390 L 125 285 Q 140 330 145 390 Z" fill="url(#jerseyRed)" stroke="#1f2937" stroke-width="3"/>
    <path d="M 310 390 L 275 285 Q 260 330 255 390 Z" fill="url(#jerseyRed)" stroke="#1f2937" stroke-width="3"/>
    <!-- Girocollo Rosso Vintage -->
    <path d="M 160 280 Q 200 310 240 280 Q 200 292 160 280 Z" fill="url(#jerseyRed)" stroke="#1f2937" stroke-width="3.5"/>
    <!-- Numero Atletico Anni '80 (#8) -->
    <text x="200" y="365" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" fill="#dc2626" stroke="#1f2937" stroke-width="2.5" text-anchor="middle">8</text>
  </g>

  <!-- Collo con Ombra Cel-Shade Netta -->
  <g id="neck">
    <path d="M 175 210 L 175 292 Q 200 304 225 292 L 225 210 Z" fill="url(#skinBase)" stroke="#1f2937" stroke-width="4"/>
    <!-- Ombra netta sotto al mento triangolare classica anni '80 -->
    <path d="M 175 220 L 200 255 L 225 220 L 225 242 Q 200 268 175 242 Z" fill="#f8b691"/>
  </g>

  <!-- Orecchie Anime con Orecchino Sportivo -->
  <ellipse cx="136" cy="195" rx="13" ry="20" fill="url(#skinBase)" stroke="#1f2937" stroke-width="3.5"/>
  <path d="M 134 190 Q 140 195 136 204" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <ellipse cx="264" cy="195" rx="13" ry="20" fill="url(#skinBase)" stroke="#1f2937" stroke-width="3.5"/>
  <path d="M 266 190 Q 260 195 264 204" fill="none" stroke="#1f2937" stroke-width="2.5"/>

  <!-- Viso Cel-Shade (Mento Aguzzo e Lineamenti Espressivi) -->
  <g id="faceGroup" filter="url(#celShadow)">
    <path d="M 142 160 Q 140 215 178 245 Q 200 260 222 245 Q 260 215 258 160 Q 255 105 200 105 Q 145 105 142 160 Z" fill="url(#skinBase)" stroke="#1f2937" stroke-width="4"/>
  </g>

  <!-- Occhi Anime Iconici "Mila e Shiro" (Grandi, Lucenti, Ciglia Spesse) -->
  <g id="retroEyes">
    <!-- Occhio Sinistro -->
    <g id="leftEye">
      <!-- Arcata Cigliare Superiore Spessa e Marcata -->
      <path d="M 152 178 Q 170 160 194 174" fill="none" stroke="#111827" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 150 174 L 145 168" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
      <!-- Fondo Bianco -->
      <path d="M 156 179 Q 174 167 190 178 Q 186 206 173 206 Q 160 206 156 179 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
      <!-- Iride Vintage Grandissimo a Strati -->
      <ellipse cx="174" cy="190" rx="12" ry="15" fill="url(#irisRetro)"/>
      <!-- Pupilla Nera Grande -->
      <ellipse cx="174" cy="189" rx="7" ry="9" fill="#0f172a"/>
      <!-- Bagliori di Luce Iconici Doppi (Stile 1984) -->
      <circle cx="169" cy="183" r="4.5" fill="#ffffff"/>
      <circle cx="179" cy="196" r="2.5" fill="#ffffff"/>
      <circle cx="171" cy="196" r="1.5" fill="#ffffff"/>
      <!-- Bordo Inferiore Occhio -->
      <path d="M 162 206 Q 173 208 184 205" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Occhio Destro -->
    <g id="rightEye">
      <!-- Arcata Cigliare Superiore Spessa e Marcata -->
      <path d="M 206 174 Q 230 160 248 178" fill="none" stroke="#111827" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 250 174 L 255 168" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
      <!-- Fondo Bianco -->
      <path d="M 210 178 Q 226 167 244 179 Q 240 206 227 206 Q 214 206 210 178 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
      <!-- Iride Vintage Grandissimo a Strati -->
      <ellipse cx="226" cy="190" rx="12" ry="15" fill="url(#irisRetro)"/>
      <!-- Pupilla Nera Grande -->
      <ellipse cx="226" cy="189" rx="7" ry="9" fill="#0f172a"/>
      <!-- Bagliori di Luce Iconici Doppi -->
      <circle cx="221" cy="183" r="4.5" fill="#ffffff"/>
      <circle cx="231" cy="196" r="2.5" fill="#ffffff"/>
      <circle cx="223" cy="196" r="1.5" fill="#ffffff"/>
      <!-- Bordo Inferiore Occhio -->
      <path d="M 216 205 Q 227 208 238 206" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Sopracciglia Flessuose e Decise Anni '80 -->
    <path d="M 152 163 Q 172 153 194 162" fill="none" stroke="#9a1d00" stroke-width="4" stroke-linecap="round"/>
    <path d="M 206 162 Q 228 153 248 163" fill="none" stroke="#9a1d00" stroke-width="4" stroke-linecap="round"/>

    <!-- Blush / Righe Parallele sulle Guance Tipiche degli Anime Vintage -->
    <g stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
      <!-- Guancia Sinistra -->
      <line x1="150" y1="210" x2="155" y2="218"/>
      <line x1="156" y1="209" x2="161" y2="217"/>
      <line x1="162" y1="210" x2="167" y2="218"/>
      <!-- Guancia Destra -->
      <line x1="233" y1="210" x2="238" y2="218"/>
      <line x1="239" y1="209" x2="244" y2="217"/>
      <line x1="245" y1="210" x2="250" y2="218"/>
    </g>

    <!-- Naso Anime Piccolo e Mento Dolce -->
    <path d="M 201 195 L 198 204 L 203 204" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bocca Sorridente ed Energica con Denti a Vista -->
    <path d="M 186 224 Q 200 242 214 224 Q 200 220 186 224 Z" fill="#b91c1c" stroke="#111827" stroke-width="3"/>
    <!-- Linea Denti Bianchi -->
    <path d="M 188 224 Q 200 230 212 224 Q 200 221 188 224 Z" fill="#ffffff"/>
  </g>

  <!-- Capelli Ribelli e Spettinati Stile Mila Hazuki (Ciocche Appuntite Vintage) -->
  <g id="retroHair">
    <!-- Massa Posteriore e Ciocche Sinistre -->
    <path d="M 142 150 Q 110 110 80 140 Q 60 90 120 70 Q 100 30 160 40 Q 180 15 220 25 Q 260 20 280 50 Q 330 40 330 90 Q 345 130 300 150 Q 320 200 270 215 Q 260 170 255 150 Z" fill="url(#hairShadow)" stroke="#111827" stroke-width="4"/>

    <!-- Ciocche Principali Anteriori (Frangia Dinamica e Spettinata) -->
    <path d="M 130 145 Q 115 100 160 70 Q 140 100 170 115 Q 165 80 200 60 Q 210 95 225 105 Q 235 75 260 70 Q 255 100 275 115 Q 290 135 265 155 Q 255 130 240 135 Q 230 155 210 140 Q 200 160 185 135 Q 165 155 150 135 Q 140 155 130 145 Z" fill="url(#hairOrange)" stroke="#111827" stroke-width="4"/>

    <!-- Ciocche di Contorno Viso (Basette Lunghe Vintage) -->
    <path d="M 142 145 Q 130 190 138 220 Q 142 195 148 165 Z" fill="url(#hairOrange)" stroke="#111827" stroke-width="3"/>
    <path d="M 258 145 Q 270 190 262 220 Q 258 195 252 165 Z" fill="url(#hairOrange)" stroke="#111827" stroke-width="3"/>

    <!-- Punti di Luce Tipici dell'Animazione Anni '80 sui Capelli -->
    <path d="M 145 75 Q 170 55 200 50 Q 230 55 255 75 Q 235 68 200 65 Q 165 68 145 75 Z" fill="#ffedd5" opacity="0.6"/>
  </g>

</svg>
